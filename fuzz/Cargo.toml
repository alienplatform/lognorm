[package]
name = "lognorm-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lognorm = { path = "..", features = ["otlp"] }
prost = "0.14"
# float_roundtrip makes the independent decode exact, like lognorm's literal parsing.
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "normalize"
path = "fuzz_targets/normalize.rs"
test = false
doc = false
bench = false
